<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retrouvez les services, réalisations et contacts de Linguère Digital Innovation.">
  <!-- Une page d'erreur ne doit jamais être indexée -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <title>Page introuvable (404) | Linguère Digital Innovation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 60vh;
      padding: 4rem 1rem;
    }

    /* Le code d'erreur est décoratif : le vrai titre de la page est le <h1>. */
    .error-code {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--color-primary); /* repli si background-clip non supporté */
      margin-bottom: 0.5rem;
    }

    .error-page h1 {
      font-size: var(--fs-h2);
      margin-bottom: 0.75rem;
    }

    /* Classe dédiée plutôt que `.error-page p` : ce dernier (spécificité 0,1,1)
       l'emportait sur `.error-code` (0,1,0) et annulait la taille du « 404 ». */
    .error-lead {
      /* --color-gray-2 (#64748B) sur blanc = 4,76:1 → conforme WCAG AA */
      color: var(--color-gray-2);
      font-size: var(--fs-body);
      max-width: 48ch;
      margin: 0 auto 2rem;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .error-suggestions {
      width: 100%;
      max-width: 640px;
      border-top: 1px solid var(--color-glass-border);
      padding-top: 2rem;
    }

    .error-suggestions h2 {
      font-size: var(--fs-h3);
      margin-bottom: 1rem;
    }

    .error-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }

    .error-links a {
      display: block;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .error-links a:hover {
      background: var(--color-surface-2);
      border-color: var(--color-glass-border-bright);
    }

    .error-links a:focus-visible {
      outline: 2px solid var(--color-primary-bright);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main id="main-content" class="container error-page">
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Cette page est introuvable</h1>
    <p class="error-lead">
      L'adresse demandée n'existe pas, ou la page a été déplacée.
      Vérifiez l'URL, ou repartez de l'une des sections ci-dessous.
    </p>

    <div class="error-actions">
      <a href="/" class="btn btn-primary btn-lg">Retour à l'accueil</a>
      <a href="/contact.html" class="btn btn-outline btn-lg">Nous contacter</a>
    </div>

    <section class="error-suggestions" aria-labelledby="suggestions-title">
      <h2 id="suggestions-title">Pages principales</h2>
      <ul class="error-links">
        <li><a href="/services.html">Nos services</a></li>
        <li><a href="/realisations.html">Réalisations</a></li>
        <li><a href="/about.html">À propos</a></li>
        <li><a href="/blog.html">Blog</a></li>
      </ul>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/components.js"></script>
</body>
</html>
